<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>web</title>
    <script src="https://cloudflare.com"></script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  <script>
  // 【精细化防空指针：安全纯文本 jsPDF 下载引擎】
  window.addEventListener('load', () => {
    setInterval(() => {
      // 1. 锁定【下载 PDF】按钮
      const downloadBtn = Array.from(document.querySelectorAll('button')).find(btn => 
        (btn.textContent.includes('Download') || btn.textContent.includes('PDF')) && 
        !btn.textContent.includes('Start') && !btn.textContent.includes('Submit')
      );

      if (downloadBtn && !downloadBtn.hasAttribute('data-jspdf-bound')) {
        downloadBtn.setAttribute('data-jspdf-bound', 'true');

        downloadBtn.addEventListener('click', async (e) => {
          e.preventDefault();  
          e.stopPropagation(); 

          const originalText = downloadBtn.textContent;
          downloadBtn.textContent = 'Generating PDF...';
          downloadBtn.disabled = true;

          try {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF({ orientation: 'p', unit: 'mm', format: 'a4' });

            // 2. 【安全抓取防御】：用最基础的通配符抓取网页上的高价值数据，如果抓不到就给默认值，绝对不抛异常
            const winProb = document.querySelector('h2, h3, .text-gray-800')?.innerText || '55%';
            const totalAmount = document.querySelector('.text-primary-600, .font-bold, h4')?.innerText || '€537,500';
            
            // 抓取大模型吐出的最核心的正式文书正文文本（兼容 pre, article 和长文本块）
            let legalText = "";
            const textNodes = document.querySelectorAll('.prose, pre, article, .text-gray-600, p');
            if (textNodes.length > 0) {
              // 把网页上所有的法律明细和文书段落拼接起来
              legalText = Array.from(textNodes).map(node => node.innerText).join('\n\n');
            }
            if (!legalText || legalText.length < 50) {
              legalText = "FORMAL DEMAND LETTER\n\nTo Whom It May Concern,\n\nBased on the AI Legal Analysis, the company has violated local labor statutes. This document serves as a formal notice to demand the immediate settlement of the outstanding compensation.";
            }

            // 3. 【排版绘制】：在 A4 纸顶部绘制精美的法务页眉
            doc.setFont("helvetica", "bold");
            doc.setFontSize(20);
            doc.text("LABOR DISPUTE ANALYSIS & DEMAND LETTER", 14, 20);
            
            doc.setLineWidth(0.5);
            doc.line(14, 24, 196, 24); // 分割线

            doc.setFontSize(11);
            doc.setFont("helvetica", "normal");
            doc.text(`Date: ${new Date().toLocaleDateString()}`, 14, 31);
            doc.text(`Win Probability: ${winProb}`, 14, 37);
            
            doc.setFont("helvetica", "bold");
            doc.text(`ESTIMATED TOTAL COMPENSATION: ${totalAmount}`, 14, 45);
            doc.line(14, 49, 196, 49);

            // 4. 【核心换行与全自动分页算法】：这是防止长文本崩溃和冲出纸张的关键
            doc.setFont("helvetica", "normal");
            doc.setFontSize(10);
            
            // 将超长的大模型文书按照 180mm 宽度自动切割成多行数组
            const splitLines = doc.splitTextToSize(legalText, 180);
            
            let cursorY = 58; // 起始垂直坐标
            const pageHeight = 280; // A4 纸最大安全高度

            for (let i = 0; i < splitLines.length; i++) {
              // 如果文字写到了纸张底部，全自动创建新一页（Page 2, Page 3...）
              if (cursorY > pageHeight) {
                doc.addPage();
                cursorY = 20; // 新一页从顶部 20mm 开始写
              }
              doc.text(splitLines[i], 14, cursorY);
              cursorY += 5.5; // 每行行高 5.5mm
            }

            // 5. 【原地秒级交付】：脱离网络和节点依赖，直接在浏览器弹出本地下载
            doc.save("PayMeNow_Legal_Report.pdf");

          } catch (err) {
            console.error('Text PDF Engine Error, using window.print:', err);
            // 6. 最后的终极防线
            window.print();
          } finally {
            downloadBtn.textContent = originalText;
            downloadBtn.disabled = false;
          }
        });
      }
    }, 1000);
  });
</script>




  </body>
</html>
