<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>web</title>
    <script src="https://cloudflare.com"></script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  <script>
  // 【网页全自动等比克隆 jsPDF 下载引擎】
  window.addEventListener('load', () => {
    setInterval(() => {
      // 1. 精准锁定【下载 PDF】按钮，避开首页的提交按钮
      const downloadBtn = Array.from(document.querySelectorAll('button')).find(btn => 
        (btn.textContent.includes('Download') || btn.textContent.includes('PDF')) && 
        !btn.textContent.includes('Start') && !btn.textContent.includes('Submit')
      );

      if (downloadBtn && !downloadBtn.hasAttribute('data-jspdf-bound')) {
        downloadBtn.setAttribute('data-jspdf-bound', 'true');

        downloadBtn.addEventListener('click', async (e) => {
          e.preventDefault();  
          e.stopPropagation(); 

          const originalText = downloadBtn.textContent;
          downloadBtn.textContent = 'Generating PDF...';
          downloadBtn.disabled = true;

          try {
            // 2. 【终极抓取】：直接抓取结果卡片的底层大盒子，连带样式表格一起打包克隆
            // 它会聪明的自动寻找带有胜诉概率、赔偿金的那个大框框
            const targetElement = document.querySelector('main') || document.querySelector('.max-w-6xl') || document.body;

            const { jsPDF } = window.jspdf;
            const doc = new jsPDF({ orientation: 'p', unit: 'mm', format: 'a4' });

            // 3. 【无脑克隆渲染】：jsPDF 官方的高级 html 渲染插件，不需要处理恶心的文本换行和乱码
            await doc.html(targetElement, {
              callback: function (doc) {
                // 4. 渲染完成，直接弹出 PDF 下载，100% 成功
                doc.save("PayMeNow_Legal_Report.pdf");
              },
              x: 10,
              y: 10,
              width: 190, // 自动缩放到 A4 纸的标准可印刷宽度内
              windowWidth: targetElement.clientWidth // 保持和用户在手机/电脑屏幕上看到的一模一样
            });

          } catch (err) {
            console.error('PDF Engine Error, falling back to window.print:', err);
            // 5. 【终极兜底双保险】：如果由于极特殊原因连克隆都失败了，直接无感唤醒浏览器的原生官方高阶打印机，导出 PDF
            window.print();
          } finally {
            downloadBtn.textContent = originalText;
            downloadBtn.disabled = false;
          }
        });
      }
    }, 1000);
  });
</script>



  </body>
</html>
