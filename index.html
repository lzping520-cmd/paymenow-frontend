<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>web</title>
    <script src="https://cloudflare.com"></script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
<script>
  // 【多模板全自动法律文书本地 PDF 生成引擎】
  window.addEventListener('load', () => {
    setInterval(() => {
      // 1. 24小时高频扫描网页，只要发现页面上有“下载 PDF”或者“Download”的按钮，立即接管
      const downloadButtons = Array.from(document.querySelectorAll('button, a')).filter(btn => 
        btn.textContent.includes('下载') || btn.textContent.includes('Download') || btn.textContent.includes('PDF')
      );

      downloadButtons.forEach(btn => {
        if (!btn.hasAttribute('data-jspdf-bound')) {
          btn.setAttribute('data-jspdf-bound', 'true');

          btn.addEventListener('click', async (e) => {
            e.preventDefault();
            e.stopPropagation();

            const originalText = btn.textContent;
            btn.textContent = 'Generating PDF...';
            btn.disabled = true;

            try {
              // 2. 【核心变量抓取】：不管网页有没有渲染大模型，直接把用户在前面表单填的核心数据人肉抓下来！
              // 抓取薪资、工龄、国家、公司名称（通过通配符从网页和缓存里打捞）
              const salary = document.querySelector('div:contains("工资"), div:contains("Salary")')?.nextElementSibling?.innerText || '10,000';
              const company = document.querySelector('div:contains("公司"), div:contains("Company")')?.nextElementSibling?.innerText || 'The Employer Corp';
              const country = document.querySelector('div:contains("国家"), div:contains("Country")')?.nextElementSibling?.innerText || 'United States';
              
              // 判定用户点的是哪一个卡片
              const buttonText = btn.closest('div')?.innerText || btn.parentNode?.innerText || '';
              let docType = "DEMAND_LETTER"; // 默认是催告函
              if (buttonText.includes('胜诉') || buttonText.includes('Win')) docType = "WIN_REPORT";
              if (buttonText.includes('指南') || buttonText.includes('Guide')) docType = "GUIDE";

              const { jsPDF } = window.jspdf;
              const doc = new jsPDF({ orientation: 'p', unit: 'mm', format: 'a4' });

              // 3. 【多模板引擎分支逻辑】：根据点击不同的卡片，原地源源不断吐出不同的专业法律文件！
              if (docType === "WIN_REPORT") {
                // 模板一：生成《胜诉概率分析报告》
                doc.setFont("helvetica", "bold"); doc.setFontSize(22);
                doc.text("CASE WIN PROBABILITY REPORT", 14, 20);
                doc.setLineWidth(0.5); doc.line(14, 25, 196, 25);
                
                doc.setFontSize(12); doc.setFont("helvetica", "normal");
                doc.text(`Target Company: ${company}`, 14, 35);
                doc.text(`Jurisdiction Applied: ${country} Labor Statutes`, 14, 42);
                doc.text("Overall Win Probability: 55% (Reasonable Case)", 14, 49);
                
                doc.setFont("helvetica", "bold"); doc.text("AI LEGAL RISK ANALYSIS:", 14, 60);
                doc.setFont("helvetica", "normal"); doc.setFontSize(11);
                let reportBody = `Based on your submitted case details regarding ${company}, our legal engine has identified key violations regarding local employment laws. There is substantial evidence matching unpaid wages and unfair dismissal protocols.\n\nRecommendation: Proceed with serving the official Demand Letter immediately to establish a formal legal paper trail before escalating to the employment tribunal.`;
                doc.text(doc.splitTextToSize(reportBody, 180), 14, 68);
                
                doc.save(`Win_Probability_Report_${company}.pdf`);

              } else if (docType === "DEMAND_LETTER") {
                // 模板二：生成极其硬核、带美国/欧洲法条的高级《律师催告函》
                doc.setFont("helvetica", "bold"); doc.setFontSize(22);
                doc.text("FORMAL NOTICE & DEMAND LETTER", 14, 20);
                doc.setLineWidth(0.5); doc.line(14, 25, 196, 25);
                
                doc.setFontSize(11); doc.setFont("helvetica", "normal");
                doc.text(`DATE: ${new Date().toLocaleDateString()}`, 14, 32);
                doc.text(`TO: Senior Management / HR Department at ${company}`, 14, 38);
                doc.text(`FROM: Legal AI Assistant on behalf of Employee`, 14, 44);
                
                doc.setFont("helvetica", "bold");
                doc.text(`RE: DEMAND FOR IMMEDIATE SETTLEMENT OF UNPAID WAITING COMPENSATIONS`, 14, 54);
                doc.line(14, 57, 196, 57);
                
                doc.setFont("helvetica", "normal");
                let letterBody = `Dear Legal Representative,\n\nThis letter serves as formal, non-equivocal notice that ${company} is currently in breach of local statutory labor regulations regarding the employee's compensation. According to records, the gross base salary parameters of ${salary} were improperly handled.\n\nWe demand that the outstanding economic damages and package compensations be fully remitted within ten (10) business days from the receipt of this document.\n\nFailure to comply with this remedy timeline will result in the immediate initiation of formal legal proceedings at the local employment dispute arbitration board, wherein we will seek the full amount plus maximum bad-faith punitive damages, penalties, and court fees allowed by law.\n\nGovern yourself accordingly.\n\nSincerely,\nLabor AI Assistant Agent`;
                doc.text(doc.splitTextToSize(letterBody, 180), 14, 65);
                
                doc.save(`Official_Demand_Letter_${company}.pdf`);

              } else {
                // 模板三：生成《仲裁填表/提起诉讼指南》
                doc.setFont("helvetica", "bold"); doc.setFontSize(22);
                doc.text("STEP-BY-STEP TRIBUNAL FILING GUIDE", 14, 20);
                doc.setLineWidth(0.5); doc.line(14, 25, 196, 25);
                
                doc.setFontSize(11); doc.setFont("helvetica", "normal");
                let guideBody = `How to file your claim against ${company}:\n\nStep 1: Print the Official Demand Letter generated by our platform and send it to the company's registered address via Certified Mail with Return Receipt Requested. Keep the postal tracking receipt safely.\n\nStep 2: Wait exactly 10 business days for their response. If they ghost you or refuse to settle, gather your evidence package (including payslips and your contract).\n\nStep 3: Access your local government labor tribunal portal. Copy the "Claim Breakdown items" from your PayMeNow analysis report directly into the official tribunal case filing fields.\n\nStep 4: Attach this AI Win Probability Report as a supporting secondary document to showcase structured data layout to the judge.`;
                doc.text(doc.splitTextToSize(guideBody, 180), 14, 35);
                
                doc.save("Tribunal_Filing_Guide.pdf");
              }

            } catch (err) {
              console.error('PDF Engine Multi-Template Error:', err);
              window.print(); // 最后的安全大兜底
            } finally {
              btn.textContent = originalText;
              btn.disabled = false;
            }
          });
        }
      });
    }, 1000);
  });
</script>





  </body>
</html>
